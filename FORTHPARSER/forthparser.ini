; forthparser.ini - version 1.0.0.0.5
; Every interactive Ask() input has a default below.
; Values are loaded as Ask() defaults on the next run.
; After a successful prompt sequence, selected values are saved here.
; Named Ask() history is kept independently.
[ForthParser]

; Ask() #1: FORTH source file, relative to forthparser.mac or absolute.
input=example.fth
; Other examples (uncomment by replacing input above):
; input=example_invalid.fth
; input=C:\work\test.fth

; Ask() #2: action (choose exactly one of L, P, E).
; L = lexical token listing
; P = hierarchical parser listing
; E = execute program using the semantic engine
action=E
; action=L
; action=P
