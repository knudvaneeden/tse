; SCROLLWORDCARRIAGERETURN configuration
; Version: 1.0.0.0.0
; Date: 2026-09-25

[scrollwordcarriagereturn]
; Horizontal target position as a percentage of the editing-window width.
; 50 = center, 25 = left quarter, 75 = right quarter.
targetbegin=25
targetend=75

; true  = do not show a Warn() box when executing the macro.
; false = show the informative Warn() box after scrolling.
; silent=false
silent=true
