; MULTIREGEX version 1.0.0.0.27
; SearchOptions are normalized in alphabetic order: a,g,i,l,v,x
; Option a searches all normal buffers in the TSE ring; a and l are exclusive.
; Ring-wide search in this version requires g and v (e.g. agivx).
; Local l accepts INCLUSIVE, NONINCLUSIVE and LINE selections.
[MultiRegex]
SearchExpression=BEGIN TRANSACTION.*COMMIT TRANSACTION
SearchOptions=ix
MaximumWindow=4000
; Increase only for a long physical line, up to 30000.
AdaptiveWindow=30000
; 1 = sequential Down/Up scanning, 0 = old GotoLine approach
; false (default): buffer screen updates while scanning; true: show source contents
ShowSourceDuringSearch=0
FastScan=1
; 0 = v19 planner (safe default); 1 = exact cached overlap planner
FastPlan=0
Overlap=2000
DialogStyle=tse
; 1 = phase diagnostics in results header; 0 = uninstrumented benchmark
ProfileEnabled=1
