; MULTIREGEX version 1.0.0.0.38
; SearchOptions are normalized in alphabetic order: a,d,g,i,l,v,x
; a = loaded TSE ring, d = recursive disk, ad = both (deduplicated).
; a/d are incompatible with l (local marked block).
; Ring-wide search in this version requires g and v (e.g. agivx).
; Local l accepts INCLUSIVE, NONINCLUSIVE and LINE selections.
[MultiRegex]
SearchExpression=BEGIN TRANSACTION.*COMMIT TRANSACTION
SearchOptions=ix
; Maximum actual matched-text preview characters (20..240; default 240).
; The filename and line/column prefix are unchanged and take priority.
ResultPreviewLength=240
; Only applied AFTER searching in the results viewer.
; Number of actual match-preview characters to highlight at the beginning.
HighlightMatchBeginning=15
; Number of characters to highlight at the TRUE end (not truncated preview).
HighlightMatchEnding=25
MaximumWindow=4000
; Increase only for a long physical line, up to 30000.
AdaptiveWindow=30000
; 1 = sequential Down/Up scanning, 0 = old GotoLine approach
; 0 (default): keep the editor body buffered; only Message() reports progress
; 1: show source file contents during scanning
ShowSourceDuringSearch=0
FastScan=1
; 0 = v19 planner (safe default); 1 = exact cached overlap planner
FastPlan=0
Overlap=2000
; Small ring files (<=10000 lines): allow up to 4096 physical source lines
; per bounded character chunk, avoiding quadratic re-copying of very short
; lines.  Other search modes/large ring files retain 256. Range 256..4096.
RingMaxChunkLines=4096
DialogStyle=tse
; 1 = phase diagnostics in results header; 0 = uninstrumented benchmark
ProfileEnabled=1

; Disk-search mode d (e.g. dgivx), combined ring+disk adgivx.
; Semicolon-separated root directories, e.g. F:\BBC\TAAL;G:\SOURCES
; If absent, the current directory is used.
TopDirectories=.
; Include only these file masks (archives are NOT searched yet).
FileMasks=*.s;*.si;*.txt;*.dat
; Search subdirectories (1=yes; 0=no).
Recursive=1
; Excluded subdirectory names, separated by semicolons.
ExcludeDirectories=.git;node_modules
; Safety limits on directory traversal and files opened during a scan.
DiskMaxFiles=10000
DiskMaxDepth=32
