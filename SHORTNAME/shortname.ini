[shortname]
; Empty directory uses TSE's current directory. Relative paths use it too.
directory=
filemask=*
; false inserts just the filename; true inserts the API-returned short path.
insertfullpath=false
; false shows the startup and error Warn boxes; true suppresses them.
silent=false
