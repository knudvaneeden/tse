; FILEFIN2TSE 1.0.0.0.9
; Native TSE SAL filename finder, derived from GREPZIPTSE 1.0.0.0.84
[SearchDefaults]
filename=*.s
; SearchString= is accepted as a fallback for GREPZIPTSE compatibility.
; DOS wildcards * and ?; case-insensitive (SearchOptions is compatibility only)
SearchOptions=i
; One or more semicolon-separated starting directories or glob specifications
TopDirectories=c:\temp\
searcharchives=yes

[Logging]
CreateLog=true
LogDirectory=

[ArchiveTools]
; TAR/TGZ use an external TAR executable; ZIP/JAR is handled by SAL.
; Use Windows tar by default; uncomment Cygwin alternative and comment
; the Windows default to switch. Leave value blank to search PATH.
TarExecutable=C:\Windows\System32\tar.exe
;TarExecutable=G:\CYGWIN\bin\tar.exe
; Cygwin TAR automatically receives /cygdrive/<letter>/... paths.
; Optional tools for 7z and RAR
SevenZipExecutable=C:\Program Files\7-Zip\7z.exe
RarExecutable=C:\Program Files\WinRAR\Rar.exe

[Linux]
TopDirectories=/tmp/
; For TSE Linux on WSL or native Ubuntu; blank uses PATH lookup.
TarExecutable=/usr/bin/tar
SevenZipExecutable=/usr/bin/7z
RarExecutable=/usr/bin/rar

[Diagnostics]
ShowStartupDiagnostics=false
