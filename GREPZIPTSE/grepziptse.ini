; GREPZIPTSE 1.0.0.0.44
[ArchiveTools]
SevenZipExecutable=C:\Program Files\7-Zip\7z.exe
RarExecutable=C:\Program Files\WinRAR\Rar.exe

[SearchDefaults]
SearchString=foobar
SearchOptions=ix
; Semicolon-separated directories or file specifications.
TopDirectories=c:\temp\
SearchArchives=yes

[Logging]
; true: create a timestamped log (optional, disabled by default).
CreateLog=false
; Empty: create the log beside the running grepziptse.mac file.
; Absolute paths are accepted. Relative paths resolve under the macro directory.
; If unwritable, falls back to macro directory, then CurrDir().
LogDirectory=

; Used only by TSE for Linux. Native ZIP/JAR searching needs no executable.
[Linux]
TopDirectories=/tmp/
SevenZipExecutable=/usr/bin/7z
RarExecutable=/usr/bin/rar

[Diagnostics]
; No informational startup warnings by default. Array-test failures always warn.
ShowStartupDiagnostics=false
