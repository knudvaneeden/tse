; GREPZIP archive-tool configuration
; Version 1.0.0.0.33 - 2026-11-13
; Edit these values if the programs are installed elsewhere.

[ArchiveTools]
SevenZipExecutable=C:\Program Files\7-Zip\7z.exe
RarExecutable=C:\Program Files\WinRAR\Rar.exe

[SearchDefaults]
searchstring=foobar
searchoptions=ix
topdirectories=c:\temp\
showfilenames=true
searcharchives=yes

[Logging]
; true: create a timestamped log (optional, disabled by default).
CreateLog=false
; Empty: create the log beside the running grepzip.mac file.
; Absolute paths are accepted. Relative paths resolve under the macro directory.
; If unwritable, falls back to macro directory, then CurrDir().
LogDirectory=
