; databaserecordheaderbodysearch 1.0.0.0.24
; Values are used as Ask() defaults. Each Ask() uses its own named GetFreeHistory() history list.
[default]
headersearch=TSE
bodysearch=the
headersearchoptions=iwx
bodysearchoptions=ix
; Relative filenames resolve next to the compiled .mac file.
outputfile=databaserecordheaderbodysearch_results.txt

; TSE color attribute numbers (foreground/background combined).
; Defaults suit a white background: blue header and red body.
headercolor=249
bodycolor=244
; Search progress uses native MarkLine() selection on the matched BODY line.
; The matching Q. header stays at the top; no source display hook is used.

; Maximum number of characters shown strictly AFTER each found body match.
; Range 0..255; 0 shows only the match.
bodyaftermax=255

; Show only records where both HEADER and BODY match (1=yes, 0=no).
showsearchprogress=1
; Redraw after this many records matching BOTH header and body.
progressinterval=1

; Body begins on line A.+5, immediately after the repeated title line.

; HEADER options: a=all files in ring; l=current file; i=ignore case; w=whole word; x=regex.
; a and l may not be combined. Neither means current file.
; BODY options: i, w, x only; record boundaries always restrict the search.
; A result mapping file (*.map) is created next to the results file.

; Version 1.0.0.0.24: a-mode restores the current ring buffer before NextFile().

; Result rows show: line number, [filename], Q. header, BODY preview.
; Full absolute source file path stays in the .map navigation file.
