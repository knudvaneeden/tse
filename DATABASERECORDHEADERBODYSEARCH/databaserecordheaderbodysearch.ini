; databaserecordheaderbodysearch 1.0.0.0.35
; Values are used as Ask() defaults. Each Ask() uses its own named GetFreeHistory() history list.
[default]
headersearch=TSE
bodysearch=the
headersearchoptions=iwx
bodysearchoptions=ix
; Relative filenames resolve next to the compiled .mac file.
outputfile=databaserecordheaderbodysearch_results.txt

; TSE color attribute numbers (foreground/background combined).
; Defaults suit a white background: blue header and red body.
headercolor=249
bodycolor=244
; Search progress uses native MarkLine() selection on the matched BODY line.
; The matching Q. header stays at the top; no source display hook is used.

; Maximum number of characters shown strictly AFTER each found body match.
; Range 0..255; 0 shows only the match.
bodyaftermax=255

; Display matching records while scanning: 0=no (default, faster), 1=yes.
; The final results overview is always shown, regardless of this setting.
showsearchprogress=0
; Redraw after this many records matching BOTH header and body.
progressinterval=1

; Lightweight status on the message bar, without redrawing the editor.
; Default 1 = enabled. Set 0 to disable status updates.
showmessageprogress=1
; Approximate source-line interval between status updates (default 10000).
; Progress is sampled at matching Q. headers, so it may skip a threshold
; if no header match occurs near that line.
messagelineinterval=10000

; Diagnostic INFO | WARN | ERROR log; OFF by default for normal searches.
; Set logenabled=0 temporarily when diagnostics are needed.
; When enabled, the log is rewritten at the start of each run.
logenabled=0
; INFO writes INFO/WARN/ERROR, WARN writes WARN/ERROR, ERROR only errors.
loglevel=INFO
; Relative filename resolves next to the compiled macro.
logfilename=databaserecordheaderbodysearch.log
; Log detailed checkpoints once every N matching Q. headers.
; Set 1 for maximum detail; 250 is lighter for large databases.
; Log entries are buffered and periodically saved to disk.
logintervalheaders=250
; Save after this many new log entries (minimum 1).
logsaveinterval=100
; Or save after this many seconds, at the next reachable checkpoint.
logsaveintervalseconds=30
; Save ERROR events immediately.
logsaveonerror=1

; Body begins on line A.+5, immediately after the repeated title line.

; HEADER options: a=all files in ring; l=current file; i=ignore case; w=whole word; x=regex.
; a and l may not be combined. Neither means current file.
; BODY options: i, w, x only; record boundaries always restrict the search.
; A result mapping file (*.map) is created next to the results file.

; Version 1.0.0.0.34: a-mode restores the current ring buffer before NextFile().

; Result rows show: line number, [filename], Q. header, BODY preview.
; Full absolute source file path stays in the .map navigation file.

; Version 1.0.0.0.34: active search uses one FORWARD separator lookup per
; matching Q. header and a line block, without recogont/gotowist macros.
