; PROJ v2.00 package configuration, version 1.0.0.0.168
; Keep this file beside the compiled proj.mac.
; false: show the startup Warn() box when running proj directly.
; true: hide that box. Other PROJ warnings and setup prompts still appear.
silent=true
; Show the introduction once per TSE session when projstart is first run.
; This one-time launcher message is independent of silent.
showbeginmessage=true
; Default executable path; absolute or package-relative paths are accepted.
ctags=g:\utils\ctags.exe
; true: copy exact tag-generation command to Windows clipboard and retain inputs.
ctagsdebug=true

; Empty: prompt/select project normally. Set: bypass new/open project filename prompt.
; Bare names are stored in PJ; other relative paths are package-relative.
projectdirectoryorfilename=
; Empty: ask. Set: use this exact filename or directory when adding an entry.
; Relative scan paths are resolved from the package directory.
scanpath=
; yes: recursive directory scan; no: directory only; empty: ask each time.
; Ignored for an exact filename.
scansubdirectories=

; Highlight this entry when the startup Project menu opens; do not execute it.
; Allowed values: New Project or Open Project. Empty also selects New Project.
startprojectmenu=New Project

; Optional archive tools; empty means detect PATH and standard installation folders.
SevenZipExecutable=
RarExecutable=

; Local Subversion integration adapted from the supplied updafisc.s.
; Executable: full path, package-relative path, or command available on PATH.
svnexe=G:\CYGWIN\bin\svn.exe
; Empty detects cygpath.exe beside Cygwin svn.exe; optional explicit path.
svncygpath=
; Existing checkout of a local file:// repository. Empty means ask.
svnworkingdirectory=G:\VERSIONCONTROL\SUBVERSION\W1\
; Optional local repository disk directory; empty means verify from svn info.
svnrepository=
; flat matches updafisc.s basename behavior. paths preserves drive/directory structure.
; Matching basenames share one destination; the last selected source wins.
svnlayout=flat
; Automatic mode uses this message directly. Empty means Ask once.
; With-notes mode asks for each file.
svnmessage=recompiled
; true includes unsaved contents of named open buffers in uploaded snapshots.
; Source buffers are not saved, renamed, closed, or marked unchanged.
svnsnapshotunsaved=true

; Git workflow adapted from supplied updaficd.s. Existing repository required.
gitexe=G:\CYGWIN\bin\git.exe
gitworkingdirectory=G:\VERSIONCONTROL\GIT\DDD01\
; Empty locates cygpath.exe and bash.exe beside the Cygwin Git executable.
gitcygpath=
gitbash=
gitlayout=flat
; Automatic mode uses non-empty message directly; empty asks once.
gitmessage=recompiled
gitsnapshotunsaved=true
; Optional remote push after successful local commits. Uses existing credentials.
gitpush=false
gitremote=origin
; Empty uses current branch; explicit value chooses remote branch destination.
gitbranch=

; Backup projects: semicolon-separated destinations. Empty asks the user.
backupdirectories=
; false = ordinary file copies; true = ZIP archives.
backupzip=false
; Include unsaved named open buffers without saving original files.
backupsnapshotunsaved=true
; ZIP tool and command template. Change to your tool's path and syntax.
backupzipexe=G:\UTILS\ZIP\PKWARE\pkzipc.exe
backupzipcommand=cd /d "{source}" && "{exe}" -add -dir "{archive}" "*"

; Repository browser adapted from supplied svn.s. Empty location uses svnworkingdirectory.
svnbrowserlocation=
; Comparison tool receives two extracted revisions as filename arguments.
svncompareexe=G:\UTILS\COMPARE\BEYONDCOMPARE\Beyond Compare 5\BComp.exe

; External TSE Git browser macro, as used by supplied runprcgj.s.
; Installation directory is checked first; otherwise TSE macro search resolves it.
; A full path to git.mac is also accepted. No command-line parameters here.
gitbrowsermacro=git.mac

; Bundled Git browser: empty location uses gitworkingdirectory.
gitbrowserlocation=
gitcompareexe=G:\UTILS\COMPARE\BEYONDCOMPARE\Beyond Compare 5\BComp.exe
