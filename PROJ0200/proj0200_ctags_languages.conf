--beta-kinds=+p
--langdef=TSESal
--langmap=TSESal:+.s.S.si
--regex-TSESal=/PROC[ ]+([A-Za-z_][A-Za-z0-9_]*)/\1/p,procedure/i
--regex-TSESal=/^[ \t]*PUBLIC[ \t]+PROC[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\1/p,procedure/i
--regex-TSESal=/^[ \t]*(INTEGER|STRING)[ \t]+PROC[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/p,procedure/i
--regex-TSESal=/^[ \t]*PUBLIC[ \t]+(INTEGER|STRING)[ \t]+PROC[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/p,procedure/i
--regex-TSESal=/^[ \t]*(MENU|MENUBAR|DATADEF|HELPDEF|KEYDEF)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/m,declaration/i
--regex-TSESal=/^[ \t]*#[ \t]*DEFINE[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\1/d,define/i
--regex-TSESal=/^[ \t]*(INTEGER|STRING)[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]*(=|,|\[|$)/\2/v,variable/i


--langdef=ProjRust
--langmap=ProjRust:+.rs
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?((async|const|unsafe)[ \t]+)*fn[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\5/f,function/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?struct[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/s,struct/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?enum[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/e,enum/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?trait[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/t,trait/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?mod[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/m,module/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?type[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/t,type/
--regex-ProjRust=/^[ \t]*(pub(\([^)]*\))?[ \t]+)?(const|static)[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]*(:|=|;)/\4/v,variable/
--regex-ProjRust=/^[ \t]*macro_rules![ \t]*([A-Za-z_][A-Za-z0-9_]*)/\1/d,macro/

--langdef=ProjTypeScript
--langmap=ProjTypeScript:+.ts.tsx
--regex-ProjTypeScript=/^[ \t]*(export[ \t]+)?(default[ \t]+)?(async[ \t]+)?function[ \t]+([A-Za-z_$][A-Za-z0-9_$]*)/\4/f,function/
--regex-ProjTypeScript=/^[ \t]*(export[ \t]+)?(default[ \t]+)?(declare[ \t]+)?(class|interface|enum|type)[ \t]+([A-Za-z_$][A-Za-z0-9_$]*)/\5/t,type/
--regex-ProjTypeScript=/^[ \t]*(export[ \t]+)?(const|let|var)[ \t]+([A-Za-z_$][A-Za-z0-9_$]*)/\3/v,variable/

--langdef=ProjGo
--langmap=ProjGo:+.go
--regex-ProjGo=/^[ \t]*func[ \t]+(\([^)]*\)[ \t]*)?([A-Za-z_][A-Za-z0-9_]*)[ \t]*\(/\2/f,function/
--regex-ProjGo=/^[ \t]*type[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]+(struct|interface)/\1/t,type/
--regex-ProjGo=/^[ \t]*(var|const)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/v,variable/

--langdef=ProjDart
--langmap=ProjDart:+.dart
--regex-ProjDart=/^[ \t]*(abstract[ \t]+)?(class|enum|mixin|extension)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/t,type/
--regex-ProjDart=/^[ \t]*(void|int|String|bool|Future(<[^>]+>)?|dynamic)[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]*\(/\3/f,function/

--langdef=ProjHaskell
--langmap=ProjHaskell:+.hs.lhs
--regex-ProjHaskell=/^[ \t]*([a-z_][A-Za-z0-9_']*)[ \t]*::/\1/f,function/
--regex-ProjHaskell=/^[ \t]*(data|newtype|type|class)[ \t]+([A-Z][A-Za-z0-9_']*)/\2/t,type/

--langdef=ProjMaple
--langmap=ProjMaple:+.mpl.maple
--regex-ProjMaple=/^[ \t]*([A-Za-z_][A-Za-z0-9_]*)[ \t]*:=[ \t]*(proc|module)[ \t]*(\(|$)/\1/f,procedure/

--langdef=ProjR
--langmap=ProjR:+.r.R
--regex-ProjR=/^[ \t]*([A-Za-z.][A-Za-z0-9._]*)[ \t]*(<-|=)[ \t]*function[ \t]*\(/\1/f,function/

--langdef=ProjMathematica
--langmap=ProjMathematica:+.wl.wls
--regex-ProjMathematica=/^[ \t]*([A-Za-z$][A-Za-z0-9$`]*)[ \t]*\[[^]]*\][ \t]*(:=|=)/\1/f,function/
--regex-ProjMathematica=/^[ \t]*([A-Za-z$][A-Za-z0-9$`]*)[ \t]*::usage[ \t]*=/\1/v,symbol/

--langdef=ProjSwift
--langmap=ProjSwift:+.swift
--regex-ProjSwift=/^[ \t]*((public|private|internal|fileprivate|open|static|class|override)[ \t]+)*func[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/f,function/
--regex-ProjSwift=/^[ \t]*((public|private|internal|fileprivate|open)[ \t]+)*(class|struct|enum|protocol|actor)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\4/t,type/
--regex-ProjSwift=/^[ \t]*((public|private|internal|fileprivate|static)[ \t]+)*(let|var)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\4/v,variable/

--langdef=ProjSAS
--langmap=ProjSAS:+.sas
--regex-ProjSAS=/^[ \t]*%macro[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\1/m,macro/i
--regex-ProjSAS=/^[ \t]*data[ \t]+([A-Za-z_][A-Za-z0-9_.]*)[ \t]*;/\1/v,dataset/i

--langdef=ProjKotlin
--langmap=ProjKotlin:+.kt.kts
--regex-ProjKotlin=/^[ \t]*((public|private|internal|protected|suspend|inline|override)[ \t]+)*fun[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]*\(/\3/f,function/
--regex-ProjKotlin=/^[ \t]*((public|private|internal|protected|data|sealed|enum)[ \t]+)*(class|interface|object)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\4/t,type/
--regex-ProjKotlin=/^[ \t]*((public|private|internal|protected)[ \t]+)*(val|var)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\4/v,variable/

--langdef=ProjProlog
--langmap=ProjProlog:+.pro.prolog
--regex-ProjProlog=/^[ \t]*([a-z][A-Za-z0-9_]*)[ \t]*\([^)]*\)[ \t]*(:-|\.)/\1/f,predicate/
--regex-ProjProlog=/^[ \t]*([a-z][A-Za-z0-9_]*)[ \t]*:-/\1/f,predicate/

--langdef=ProjPowerShell
--langmap=ProjPowerShell:+.ps1.psm1.psd1
--regex-ProjPowerShell=/^[ \t]*(function|filter)[ \t]+([A-Za-z_][A-Za-z0-9_-]*)/\2/f,function/i
--regex-ProjPowerShell=/^[ \t]*(class|enum)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/t,type/i

--langdef=ProjScala
--langmap=ProjScala:+.scala.sc
--regex-ProjScala=/^[ \t]*((private|protected|final|override|implicit)[ \t]+)*def[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/f,function/
--regex-ProjScala=/^[ \t]*((private|protected|final|sealed|abstract|case)[ \t]+)*(class|trait|object|enum)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\4/t,type/
--regex-ProjScala=/^[ \t]*(val|var)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/v,variable/

--langdef=ProjABAP
--langmap=ProjABAP:+.abap
--regex-ProjABAP=/^[ \t]*CLASS[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]+DEFINITION/\1/c,class/i
--regex-ProjABAP=/^[ \t]*(METHOD|FORM|FUNCTION)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/f,function/i
--regex-ProjABAP=/^[ \t]*(METHODS|CLASS-METHODS)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/p,prototype/i
--regex-ProjABAP=/^[ \t]*DATA[ \t]+([A-Za-z_][A-Za-z0-9_]*)[ \t]+TYPE/\1/v,variable/i

--langdef=ProjAda
--langmap=ProjAda:+.adb.ads.ada
--regex-ProjAda=/^[ \t]*(procedure|function)[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\2/p,procedure/i
--regex-ProjAda=/^[ \t]*package[ \t]+(body[ \t]+)?([A-Za-z_][A-Za-z0-9_]*)/\2/k,package/i

--langdef=ProjActionScript
--langmap=ProjActionScript:+.as
--regex-ProjActionScript=/^[ \t]*((public|private|protected|static|override)[ \t]+)*function[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/f,function/
--regex-ProjActionScript=/^[ \t]*((public|private|protected)[ \t]+)*class[ \t]+([A-Za-z_][A-Za-z0-9_]*)/\3/c,class/

--langmap=Ant:+.xml
--regex-Ant=/^[ ]*<target[ ]+name="([^"]+)"/\1/t,target/

--langmap=Lisp:+.el
--langmap=Vim:+.vim

--langdef=ProjMarkdown
--langmap=ProjMarkdown:+.md.markdown
--regex-ProjMarkdown=/^[ ]{0,3}#{1,6}[ ]+([^ #]([^#]*[^ #])?)[ ]*#*[ ]*$/\1/h,heading/
