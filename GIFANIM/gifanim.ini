; GIFANIM version 1.0.0.0.23
[GifAnim]
; PNGs such as 01.png, _02.png, _03.png ...
; Blank: PNGs beside gifanim.mac; relative paths use TSE CurrDir().
directory=
sequence=*.png
output=01.gif
; Blank: save the GIF beside the PNGs. Relative paths use TSE CurrDir().
outputdirectory=
; Hundredths of a second (10 = 0.1 second per frame; 100 = 1 second; max 65535)
delay_cs=10
; Resize quality: sharp preserves hard text edges; smooth blends; fast is bilinear.
quality=sharp
