[GifAnim]
; PNGs such as 01.png, _02.png, _03.png ...
directory=
sequence=*.png
output=01.gif
; Blank: save the GIF beside the PNGs. A path overrides the output location.
outputdirectory=
; Hundredths of a second (10 = 0.1 second per frame; 100 = 1 second; max 65535)
delay_cs=10
