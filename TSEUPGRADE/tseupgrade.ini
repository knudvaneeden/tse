; TSEUPGRADE version 1.0.0.0.53
; Created: 2026-10-31 18:43:55
; Keep beside tseupgrade.mac and tseupgrade.ps1. Paths need no quotes.
; Blank required values are asked in the console; optional blanks skip a step.
; Relative paths resolve beside this INI. Environment variables are expanded.
[tseupgrade]
silent=false
; Automatically answer Yes to upgrade confirmations; tse.exe remains interactive.
; Also skips the launcher menu/intro and final pause; configure all required paths.
unattended=false
; Copy output: all=every file; summary=periodic progress; none=no normal copy output.
; Copy errors remain visible in every mode.
copydisplay=none
; Show one early copy-time estimate, without periodic updates or filenames.
copyeta=true
powershell_exe=
old_version=4.50.rc24
new_version=4.50.32
old_directory=F:\WORDPROC\tse32_v45024\
new_directory=F:\WORDPROC\tse32_v45032\
; Full path to the downloaded ZIP; alternatively use an already installed target.
archive_file=G:\MYDOWNLOADFILES\FROM_JOB_TO_HOME\tse-setup-4.50.32.zip
; Optional URL opened in the default browser. Download manually, then rerun.
download_url=https://semware.com/files/tse-pro-install/tse-setup-4.50.32.zip
; Installer extracted from archive_file. Relative to new_directory.
; Use subfolder\tse.exe if the ZIP contains a wrapper directory.
installer_exe=tse.exe
; Preparation compiler: blank uses compiler_exe in new_directory.
; This compiler must match the NEW-directory editor already present before setup.
; An explicit relative path resolves beside this INI.
preparation_compiler_exe=
; Automatic confirmation-file wait after editor exits, seconds (0..300).
preparation_wait_seconds=5
; Wait AFTER compiling a generated worker and BEFORE launching g32.exe (0..300).
; Applies only to preparation/CFG-export/DAT-merge workers, never wildcard batches.
generated_macro_launch_delay_seconds=5
; Paths below resolve beside INI unless stated otherwise.
ui_file=F:\BBC\TAAL\qed32v45024.ui
; New UI copy; old UI is only read. Relative paths use working_directory.
ui_destination=F:\BBC\TAAL\qed32v45032.ui
cfg_file=F:\BBC\TAAL\tse45024knu.cfg
custom_macro_directory=f:\bbc\taal\
cuamark_file=F:\WORDPROC\tse32_v45024\mac\cuamark.s
; Editor/compiler and cfg_data_file resolve relative to new_directory.
; cfg_destination resolves relative to working_directory (or new_directory if blank).
editor_exe=g32.exe
compiler_exe=sc32.exe
cfg_destination=F:\BBC\TAAL\tse45032knu.cfg
cfg_data_file=tsecfg.dat
; Optional new search paths saved by a generated macro in the new editor.
tse_path=
kbd_path=
; Optional startup directory written to new_directory\tse.ini.
working_directory=f:\bbc\taal\
; Blank uses a unique log beside this INI.
log_file=
; Old compiler data for automatic merge; blank = old_directory\compile.dat.
old_compile_data=F:\WORDPROC\tse32_v45024\compile.dat

; Automatic export from the NEW running editor, after applying settings.
; Uses cfg_destination above; must be unused. No separate module INI files.
export_cfg=true
; Automatic merge of old_compile_data into NEW compiler data.
merge_compile_data=true
; Relative to new_directory; never points to OLD data.
new_compile_data=compile.dat

; Personal macro run with -e at final launch; blank disables it.
; Final launch always starts in NEW/custom_macros, where copied macros live.
startup_macro=knudstar

; Show rough SC32 compilation estimates; record actual timing for future runs.
compileeta=true
