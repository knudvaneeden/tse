; riemannhypothesisgraph.ini - version 1.0.0.0.9
; All relative resources and generated output are beside riemannhypothesisgraph.mac.
[graph]
; light or dark: default dark
theme=dark
; image, plane or surface: default mapped image (with a domain-plane inset)
default_view=image
real_min=-6
real_max=4
imag_min=-18
imag_max=18
real_samples=151
imag_samples=181
height_cap=8
open_browser=1
; Euler-Maclaurin summation: 100 initial terms and 10 corrections.
; Precision is intended for visualization, not rigorous zero certification.
summation_terms=100
correction_terms=10
; Search non-trivial critical-line zeros numerically; does not prove RH.
zero_search_step=0.25

; Mapping w = zeta(s): image-plane axis limits (real and imaginary parts of w)
image_real_min=-3.5
image_real_max=3.5
image_imag_min=-3.5
image_imag_max=3.5
; Number of selected coordinate lines in each family (2 through 32)
image_sigma_lines=15
image_t_lines=13
; Fade lines if mapped points approach the pole or leave the image window
image_line_width=1.5
