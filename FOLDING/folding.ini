[folding]
; FOLDING 1.0.0.0.3 configuration
; Date: 2026-09-18 13:16:41 UTC
;
; Keep this file in the same directory as folding.mac.
; Values are read when folding.mac is loaded or executed.

; Text placed at the beginning of every folding placeholder.
marker_prefix=// [FOLDING:

; Sidecars are named source-name + this text + fold-number + .dat
; Example: ddd.s.folding.3.dat
sidecar_middle=.folding.

; Ask before replacing a marked line block with a placeholder.
confirm_fold=yes

; Ask before the interactive Unfold All command.
confirm_unfold_all=yes

; Restore every fold before Folding Save File or Folding Save As.
unfold_before_save=yes
