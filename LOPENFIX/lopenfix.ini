; LOPENFIX configuration file
; Version: 1.0.0.0.6
; Date: 2026-09-19
; Time: 19:41 CEST (UTC+02:00)
;
; lopenfix.ini is read from the same directory as the executing compiled
; macro, using CurrMacroFilename().
;
; nextfilekey and prevfilekey are reference-only because SAL key assignments
; are compile-time definitions and cannot be changed dynamically from an INI.

[LOPENFIX]
nextfilekey=<Alt N>
prevfilekey=<Alt P>
soundfrequency=300
sounddelay=1
usemodifiedfilelist=true
usemakefirst=true
