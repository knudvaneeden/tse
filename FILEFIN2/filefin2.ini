; FILEFIN2 external archive tool paths
; Version 1.0.0.0.44 - 2026-11-13 - OpenAI Codex
;
; Enter complete executable paths after the equals signs.
; Quotes are optional. Leave a setting blank to use automatic discovery.

[SearchDefaults]
filename=*foobar*
; Separate multiple top directories with semicolons.
topdirectories=c:\temp\
searcharchives=

[ArchiveTools]
SevenZipExecutable=C:\Program Files\7-Zip\7z.exe
RarExecutable=C:\Program Files\WinRAR\Rar.exe

[Logging]
; true: create a timestamped log (optional, disabled by default).
CreateLog=false
; Empty: create the log beside the running filefin2.mac file.
; Absolute paths are accepted. Relative paths resolve under the macro directory.
; If unwritable, falls back to macro directory, then CurrDir().
LogDirectory=
