; screenshotwindowtse.ini
; Version 1.0.0.0.18
;
; All values are read by screenshotwindowtse.s, not by the DLL.

[Save]

; Supported: png, jpg, jpeg, bmp
; png is the default.
filetype=png

; Empty means: generate a timestamped name such as
; screenshotwindowtse_20260920_091530.png
filename=

; Empty or "screenshots" means the screenshots directory beside the macro.
; Relative directories are resolved relative to the macro directory.
directory=screenshots

; Show the final success/error result box.
; true = show it, false = do not show it.
showfinalresult=true

; Empty means: capture the current foreground window.
; Non-empty means: capture a visible top-level window whose title matches.
; Exact case-insensitive match is tried first, then partial match.
; Single or double outer quotes are allowed and are stripped by TSE SAL.
windowtitle=
