; REGEXENGINE v1.0.0.0.23 experimental defaults
; Configuration is read beside the compiled regexengine.mac (not CurrDir()).
[Search]
Pattern=Ampersand{.|\n}*manager
; i = ignore case for ordinary literals
; m = extended multiline mode (\n matches line boundaries)
; l = restrict search to a marked block
; a = search all ordinary files in TSE ring (current file first)
; a and l cannot be combined
Options=aimvx
; No MaxMatchCharacters limit.
; Native Find() is used for conservative literal-prefix searching.
; A two-endpoint native Find() optimization is available for supported
; literal{.|\n}*literal and literal{.|\n}@literal patterns.
; Other patterns use the general matcher.

[Diagnostics]
; Search tracing is written to regexengine.log in the macro directory.

[Tests]
; 1 = run automated compatibility tests on launch (without Ask dialogs)
; 0 = normal interactive search
RunTests=0

[View]
; Maximum matching rows collected by the experimental v option.
; Previews show source context around match start and, for multi-line
; matches, context around match end. No intervening-text scan.
; Results are gathered without caching entire match spans.
MaxResults=2000

; v1.0.0.0.23: List() entries highlight the visible matched text using
; TSE HiLiteAttr. Custom display hook is active only while list is open.
